<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="570" viewBox="0 0 1500 570" role="img" aria-labelledby="title desc">
<title id="title">Defense in depth five-layer model</title>
<desc id="desc">Five defensive layers for endpoint, network, identity, monitoring, and recovery.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".2"/></filter></defs>
<rect width="1500" height="570" rx="28" fill="url(#bg)"/>
<text x="70" y="74" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">DEFENSE-IN-DEPTH</text>
<text x="70" y="114" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="21">Five complementary control layers recommended by the project</text>
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
 <g transform="translate(70,170)"><rect width="255" height="300" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/><circle cx="127" cy="72" r="39" fill="#2563eb"/><path d="M109 70h36M127 52v36" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="127" y="150" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">1. ENDPOINT</text><text x="127" y="195" text-anchor="middle" fill="#bfdbfe" font-size="18">EDR / NGAV</text><text x="127" y="227" text-anchor="middle" fill="#bfdbfe" font-size="18">Application control</text><text x="127" y="259" text-anchor="middle" fill="#bfdbfe" font-size="18">Script monitoring</text></g>
 <g transform="translate(355,170)"><rect width="255" height="300" rx="18" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><circle cx="127" cy="72" r="39" fill="#0891b2"/><path d="M105 60h44v26h-44zM127 60v-14M127 86v14" stroke="#fff" fill="none" stroke-width="4"/><text x="127" y="150" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">2. NETWORK</text><text x="127" y="195" text-anchor="middle" fill="#cffafe" font-size="18">Firewall / IDS/IPS</text><text x="127" y="227" text-anchor="middle" fill="#cffafe" font-size="18">Segmentation</text><text x="127" y="259" text-anchor="middle" fill="#cffafe" font-size="18">Restrict SMB / RDP</text></g>
 <g transform="translate(640,170)"><rect width="255" height="300" rx="18" fill="#14532d" stroke="#4ade80" stroke-width="2"/><circle cx="127" cy="72" r="39" fill="#16a34a"/><circle cx="127" cy="63" r="12" stroke="#fff" fill="none" stroke-width="4"/><path d="M103 94c3-20 45-20 48 0" stroke="#fff" fill="none" stroke-width="4"/><text x="127" y="150" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">3. IDENTITY</text><text x="127" y="195" text-anchor="middle" fill="#dcfce7" font-size="18">Phishing-resistant MFA</text><text x="127" y="227" text-anchor="middle" fill="#dcfce7" font-size="18">PAM / least privilege</text><text x="127" y="259" text-anchor="middle" fill="#dcfce7" font-size="18">Credential hygiene</text></g>
 <g transform="translate(925,170)"><rect width="255" height="300" rx="18" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/><circle cx="127" cy="72" r="39" fill="#7c3aed"/><path d="M104 78l15-17 12 10 20-24" stroke="#fff" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="127" y="150" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">4. MONITORING</text><text x="127" y="195" text-anchor="middle" fill="#ede9fe" font-size="18">SIEM / centralized logs</text><text x="127" y="227" text-anchor="middle" fill="#ede9fe" font-size="18">Alert triage</text><text x="127" y="259" text-anchor="middle" fill="#ede9fe" font-size="18">Incident response</text></g>
 <g transform="translate(1210,170)"><rect width="235" height="300" rx="18" fill="#7f1d1d" stroke="#fb7185" stroke-width="2"/><circle cx="117" cy="72" r="39" fill="#be123c"/><path d="M99 73l13 13 25-30" stroke="#fff" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="150" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">5. RECOVERY</text><text x="117" y="195" text-anchor="middle" fill="#ffe4e6" font-size="18">Offline / immutable</text><text x="117" y="227" text-anchor="middle" fill="#ffe4e6" font-size="18">Restore testing</text><text x="117" y="259" text-anchor="middle" fill="#ffe4e6" font-size="18">Business continuity</text></g>
</g>
<text x="70" y="525" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17">Reference recommendations; this graphic does not claim these controls were deployed in the original lab.</text>
</svg>