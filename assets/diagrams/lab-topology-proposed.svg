<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
<title id="title">Proposed isolated VMware lab network topology</title>
<desc id="desc">A proposed future layout with red-team, target, monitoring, and backup zones connected through a virtual firewall.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1500" height="820" rx="30" fill="url(#bg)"/>
<text x="65" y="72" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">PROPOSED VMWARE LAB TOPOLOGY</text>
<text x="65" y="112" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="21">Isolated Host-only VMnet zones • reference design for a future rebuild</text>
<rect x="65" y="150" width="1370" height="600" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
<rect x="95" y="178" width="1310" height="60" rx="12" fill="#e2e8f0"/>
<text x="750" y="216" font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="23" font-weight="700" fill="#334155">Physical Host  →  VMware Workstation</text>
<rect x="550" y="270" width="400" height="92" rx="16" fill="#172554"/>
<text x="750" y="309" font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Virtual Firewall / Router</text>
<text x="750" y="341" font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="17" fill="#bfdbfe">Default-deny • explicit inter-zone rules</text>
<g stroke="#64748b" stroke-width="4" fill="none">
 <path d="M750 238 V270"/>
 <path d="M750 362 V405 H245 V442"/>
 <path d="M750 362 V405 H570 V442"/>
 <path d="M750 362 V405 H910 V442"/>
 <path d="M750 362 V405 H1245 V442"/>
</g>
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
 <g transform="translate(105,442)"><rect width="280" height="210" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><rect width="280" height="50" rx="16" fill="#ea580c"/><text x="140" y="33" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">RED-TEAM ZONE</text><text x="140" y="96" fill="#7c2d12" text-anchor="middle" font-size="23" font-weight="700">Kali Linux</text><text x="140" y="132" fill="#9a3412" text-anchor="middle" font-size="18">Example: VMnet2</text><text x="140" y="166" fill="#9a3412" text-anchor="middle" font-size="16">Host-only segment</text></g>
 <g transform="translate(430,442)"><rect width="280" height="210" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><rect width="280" height="50" rx="16" fill="#2563eb"/><text x="140" y="33" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">TARGET ZONE</text><text x="140" y="96" fill="#1e3a8a" text-anchor="middle" font-size="23" font-weight="700">Windows 10 x64</text><text x="140" y="132" fill="#1d4ed8" text-anchor="middle" font-size="18">Example: VMnet3</text><text x="140" y="166" fill="#1d4ed8" text-anchor="middle" font-size="16">Controlled lab target</text></g>
 <g transform="translate(755,442)"><rect width="280" height="210" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/><rect width="280" height="50" rx="16" fill="#059669"/><text x="140" y="33" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">MONITORING ZONE</text><text x="140" y="96" fill="#065f46" text-anchor="middle" font-size="23" font-weight="700">Log Collector</text><text x="140" y="132" fill="#047857" text-anchor="middle" font-size="18">Example: VMnet4</text><text x="140" y="166" fill="#047857" text-anchor="middle" font-size="16">Centralized telemetry</text></g>
 <g transform="translate(1080,442)"><rect width="280" height="210" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/><rect width="280" height="50" rx="16" fill="#7c3aed"/><text x="140" y="33" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">BACKUP ZONE</text><text x="140" y="96" fill="#4c1d95" text-anchor="middle" font-size="23" font-weight="700">Offline / Immutable</text><text x="140" y="132" fill="#6d28d9" text-anchor="middle" font-size="18">Example: VMnet5</text><text x="140" y="166" fill="#6d28d9" text-anchor="middle" font-size="16">No red-team access</text></g>
</g>
<text x="750" y="714" fill="#64748b" font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="17">Illustrative architecture only — VMnet IDs, subnets and firewall rules were not recovered from the original lab.</text>
</svg>