<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">Recorded VMware lab demonstration workflow</title>
<desc id="desc">The submitted video shows a VMware environment with Kali Linux and Windows 10, a logistics-themed phishing scenario, and a custom ransomware proof-of-concept screen.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#263449"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".2"/></filter></defs>
<rect width="1500" height="500" rx="28" fill="url(#bg)"/>
<text x="65" y="70" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">RECORDED LAB DEMONSTRATION</text>
<text x="65" y="110" fill="#9ca3af" font-family="Inter,Arial,sans-serif" font-size="20">Visual summary of the supplied video — isolated educational PoC, not the real Asahi environment</text>
<g stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round"><path d="M320 270 H390"/><path d="M680 270 H750"/><path d="M1040 270 H1110"/><path d="M377 257l14 13-14 13"/><path d="M737 257l14 13-14 13"/><path d="M1097 257l14 13-14 13"/></g>
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
 <g transform="translate(65,160)"><rect width="255" height="225" rx="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><rect x="22" y="26" width="211" height="46" rx="9" fill="#1d4ed8"/><text x="127" y="56" fill="#fff" font-size="21" text-anchor="middle" font-weight="700">VMWARE WORKSTATION</text><text x="127" y="119" fill="#eff6ff" font-size="23" text-anchor="middle" font-weight="700">Kali Linux</text><text x="127" y="151" fill="#bfdbfe" font-size="19" text-anchor="middle">+</text><text x="127" y="183" fill="#eff6ff" font-size="23" text-anchor="middle" font-weight="700">Windows 10 x64</text></g>
 <g transform="translate(390,160)"><rect width="290" height="225" rx="18" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><circle cx="145" cy="60" r="28" fill="#0e7490"/><path d="M132 60h26M145 47v26" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="145" y="120" fill="#ecfeff" font-size="22" text-anchor="middle" font-weight="700">PHISHING SCENARIO</text><text x="145" y="158" fill="#cffafe" font-size="18" text-anchor="middle">Logistics / invoice theme</text><text x="145" y="188" fill="#cffafe" font-size="16" text-anchor="middle">Simulated message workflow</text></g>
 <g transform="translate(750,160)"><rect width="290" height="225" rx="18" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/><circle cx="145" cy="60" r="28" fill="#7e22ce"/><path d="M131 48h28v25h-28zM137 55h16M137 62h16" fill="none" stroke="#fff" stroke-width="3"/><text x="145" y="120" fill="#faf5ff" font-size="22" text-anchor="middle" font-weight="700">CUSTOM PoC</text><text x="145" y="158" fill="#ede9fe" font-size="18" text-anchor="middle">Simulated file-encryption</text><text x="145" y="188" fill="#ede9fe" font-size="16" text-anchor="middle">and lock-screen behavior</text></g>
 <g transform="translate(1110,160)"><rect width="325" height="225" rx="18" fill="#512f3a" stroke="#fb7185" stroke-width="2"/><circle cx="162" cy="60" r="28" fill="#be123c"/><path d="M162 44v22M162 78v2" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="162" y="120" fill="#fff1f2" font-size="22" text-anchor="middle" font-weight="700">OBSERVATION</text><text x="162" y="158" fill="#ffe4e6" font-size="18" text-anchor="middle">PoC behavior on lab target</text><text x="162" y="188" fill="#ffe4e6" font-size="16" text-anchor="middle">Restore from clean baseline</text></g>
</g>
<text x="65" y="445" fill="#9ca3af" font-family="Inter,Arial,sans-serif" font-size="16">Diagram summarizes the recorded demonstration; original scripts and full VM/network configuration were not recovered.</text>
