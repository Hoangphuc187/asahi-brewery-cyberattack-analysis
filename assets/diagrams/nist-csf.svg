<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
<title id="title">NIST Cybersecurity Framework 2.0 overview</title>
<desc id="desc">The six NIST CSF 2.0 functions: Govern, Identify, Protect, Detect, Respond, Recover.</desc>
<rect width="1500" height="430" rx="28" fill="#f8fafc"/>
<text x="65" y="72" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">NIST CYBERSECURITY FRAMEWORK 2.0</text>
<text x="65" y="111" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="20">Six functions used as an organizing structure for risk analysis and recommendations</text>
<g font-family="Inter,Arial,sans-serif" font-weight="700" text-anchor="middle">
 <g transform="translate(65,160)"><rect width="210" height="180" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="105" y="65" fill="#92400e" font-size="26">GOVERN</text><text x="105" y="105" fill="#78350f" font-size="16" font-weight="400">Strategy • policy</text><text x="105" y="130" fill="#78350f" font-size="16" font-weight="400">oversight</text></g>
 <g transform="translate(305,160)"><rect width="210" height="180" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="105" y="65" fill="#1e40af" font-size="26">IDENTIFY</text><text x="105" y="105" fill="#1e3a8a" font-size="16" font-weight="400">Assets • context</text><text x="105" y="130" fill="#1e3a8a" font-size="16" font-weight="400">risk assessment</text></g>
 <g transform="translate(545,160)"><rect width="210" height="180" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="105" y="65" fill="#5b21b6" font-size="26">PROTECT</text><text x="105" y="105" fill="#4c1d95" font-size="16" font-weight="400">Identity • access</text><text x="105" y="130" fill="#4c1d95" font-size="16" font-weight="400">safeguards</text></g>
 <g transform="translate(785,160)"><rect width="210" height="180" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="105" y="65" fill="#9a3412" font-size="26">DETECT</text><text x="105" y="105" fill="#7c2d12" font-size="16" font-weight="400">Continuous</text><text x="105" y="130" fill="#7c2d12" font-size="16" font-weight="400">monitoring</text></g>
 <g transform="translate(1025,160)"><rect width="210" height="180" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="105" y="65" fill="#991b1b" font-size="26">RESPOND</text><text x="105" y="105" fill="#7f1d1d" font-size="16" font-weight="400">Incident analysis</text><text x="105" y="130" fill="#7f1d1d" font-size="16" font-weight="400">and containment</text></g>
 <g transform="translate(1265,160)"><rect width="170" height="180" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="85" y="65" fill="#166534" font-size="24">RECOVER</text><text x="85" y="105" fill="#14532d" font-size="15" font-weight="400">Restore</text><text x="85" y="130" fill="#14532d" font-size="15" font-weight="400">resilience</text></g>
</g>
<text x="65" y="390" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">The project's original slides use an earlier five-function presentation; this visual reflects the six-function NIST CSF 2.0 structure.</text>
</svg>